# EventHub Phase 4 -- buildconfigs.yaml
#
# One ImageStream + BuildConfig per service. Each BuildConfig points at
# a subdirectory (contextDir) of the same public GitHub repo and uses
# that subdirectory's existing Containerfile -- no separate repos
# needed, no Docker Hub push/pull step. `oc start-build` triggers a
# build; the result lands in the matching ImageStream, which the
# Deployments (next file) reference directly.

apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: catalog
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: catalog
spec:
  source:
    type: Git
    git:
      uri: https://github.com/seba3102005/DevopsTrain2.git
      ref: main
    contextDir: services/legacy-catalog-java
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile
  output:
    to:
      kind: ImageStreamTag
      name: catalog:latest
  triggers:
    - type: ConfigChange

