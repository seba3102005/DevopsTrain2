
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  labels: { app: catalog }
spec:
  replicas: 1
  selector:
    matchLabels: { app: catalog }
  template:
    metadata:
      labels: { app: catalog }
    spec:
      containers:
        - name: catalog
          image: image-registry.openshift-image-registry.svc:5000/sebaibraheem-dev/catalog:latest
          ports: [{ containerPort: 8081 }]
          env:
            - { name: SPRING_DATASOURCE_URL, value: "jdbc:mysql://mysql:3306/eventhub_catalog" }
            - { name: SPRING_DATASOURCE_USERNAME, value: "root" }
            - { name: SPRING_DATASOURCE_PASSWORD, value: "password123" }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /health, port: 8081 }
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
spec:
  selector: { app: catalog }
  ports: [{ port: 8081, targetPort: 8081 }]
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: catalog
spec:
  to: { kind: Service, name: catalog }
  port: { targetPort: 8081 }
  tls: { termination: edge }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels: { app: auth }
spec:
  replicas: 1
  selector:
    matchLabels: { app: auth }
  template:
    metadata:
      labels: { app: auth }
    spec:
      containers:
        - name: auth
          image: image-registry.openshift-image-registry.svc:5000/sebaibraheem-dev/auth:latest
          ports: [{ containerPort: 8082 }]
          env:
            - { name: PORT, value: "8082" }
            - { name: PGHOST, value: "postgres" }
            - { name: PGPORT, value: "5432" }
            - { name: PGUSER, value: "eventhub" }
            - { name: PGPASSWORD, value: "eventhub" }
            - { name: PGDATABASE, value: "eventhub_auth" }
            - { name: JWT_SECRET, value: "change-me-in-every-environment" }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 300m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: 8082 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth
spec:
  selector: { app: auth }
  ports: [{ port: 8082, targetPort: 8082 }]
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: auth
spec:
  to: { kind: Service, name: auth }
  port: { targetPort: 8082 }
  tls: { termination: edge }

