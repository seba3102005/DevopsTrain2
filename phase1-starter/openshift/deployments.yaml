---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking
  labels: { app: booking }
spec:
  replicas: 1
  selector:
    matchLabels: { app: booking }
  template:
    metadata:
      labels: { app: booking }
    spec:
      containers:
        - name: booking
          image: image-registry.openshift-image-registry.svc:5000/sebaibraheem-dev/booking:latest
          ports: [{ containerPort: 8083 }]
          env:
            - { name: PORT, value: "8083" }
            - { name: MONGO_URI, value: "mongodb://mongo:27017" }
            - { name: MONGO_DB, value: "eventhub_bookings" }
            - { name: RABBITMQ_URL, value: "amqp://guest:guest@rabbitmq:5672/" }
            - { name: RABBITMQ_QUEUE, value: "bookings" }
            - { name: AI_INSIGHT_URL, value: "http://ai-insight:8084" }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 300m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: 8083 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: booking
spec:
  selector: { app: booking }
  ports: [{ port: 8083, targetPort: 8083 }]
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: booking
spec:
  to: { kind: Service, name: booking }
  port: { targetPort: 8083 }
  tls: { termination: edge }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  labels: { app: notification }
spec:
  replicas: 1
  selector:
    matchLabels: { app: notification }
  template:
    metadata:
      labels: { app: notification }
    spec:
      containers:
        - name: notification
          image: image-registry.openshift-image-registry.svc:5000/sebaibraheem-dev/notification:latest
          env:
            - { name: RABBITMQ_URL, value: "amqp://guest:guest@rabbitmq:5672/" }
            - { name: RABBITMQ_QUEUE, value: "bookings" }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          # No readinessProbe/Service/Route: this is a pure queue
          # consumer with no HTTP server, same as in Phase 2/3.

